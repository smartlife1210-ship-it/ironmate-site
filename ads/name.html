<!DOCTYPE html><meta charset="utf-8"><title>name</title><p id="s">loading…</p>
<script>
(async () => {
  const files = ["ironmate-1.4-ad-9x16.mp4", "ironmate-1.4-ad-4x5.mp4"];
  const out = {};
  for (const f of files) {
    const b = new Uint8Array(await (await fetch(f, { cache: "no-store" })).arrayBuffer());
    let s = ""; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768));
    out[f] = btoa(s);
  }
  window.name = "IRONADS" + JSON.stringify(out);
  document.getElementById("s").textContent = "ready " + window.name.length;
  const back = new URLSearchParams(location.search).get("back");
  if (back) location.href = back;
})();
</script>
